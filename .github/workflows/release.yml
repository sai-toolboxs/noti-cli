name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - name: Build binaries
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          mkdir -p dist

          for GOOS in linux darwin; do
            for GOARCH in amd64 arm64; do
              BINARY_NAME=noti-cli_${VERSION}_${GOOS}_${GOARCH}
              mkdir -p dist/${BINARY_NAME}

              CGO_ENABLED=0 GOOS=${GOOS} GOARCH=${GOARCH} go build \
                -ldflags "-s -w \
                  -X github.com/sai-toolboxs/noti-cli/internal/version.Version=${VERSION} \
                  -X github.com/sai-toolboxs/noti-cli/internal/version.Commit=${GITHUB_SHA::8} \
                  -X github.com/sai-toolboxs/noti-cli/internal/version.BuildDate=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
                -o dist/${BINARY_NAME}/noti-cli \
                ./cmd/noti-cli

              cd dist && tar czf ${BINARY_NAME}.tar.gz ${BINARY_NAME}/ && cd ..
              rm -rf dist/${BINARY_NAME}
            done
          done

          cd dist && sha256sum *.tar.gz > checksums.txt

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create ${{ github.ref_name }} \
            dist/*.tar.gz \
            dist/checksums.txt \
            --title "${{ github.ref_name }}" \
            --generate-notes
